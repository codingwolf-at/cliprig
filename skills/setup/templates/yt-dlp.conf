# Only when YouTube asks to "confirm you're not a bot": export your YouTube cookies to cookies.txt
# in this folder and remove the # below. yt-dlp rewrites that file on every run while the line is on,
# so put the # back and delete cookies.txt when downloads work again.
# --cookies cookies.txt
# slow down to avoid YouTube bot checks
--sleep-requests 1.5
--sleep-interval 3
--max-sleep-interval 8
