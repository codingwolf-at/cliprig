name: skills on windows

# Manual only. Headless Claude runs the skills on a Windows runner, as a user would:
# setup, then find, cut and check a clip. Needs an ANTHROPIC_API_KEY repository secret; about $1-3 a run.
on:
  workflow_dispatch:

jobs:
  skills:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TOOLS: "Bash Read Write Edit Glob Grep Skill"
    steps:
      - name: Needs the API key secret
        run: test -n "$ANTHROPIC_API_KEY" || { echo "Add an ANTHROPIC_API_KEY repository secret first"; exit 1; }
      - uses: actions/checkout@v4
        with:
          path: cliprig
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code and ffmpeg
        run: |
          npm install -g @anthropic-ai/claude-code
          choco install ffmpeg -y --no-progress

      - name: Make a test video with speech (Windows text-to-speech over a test pattern)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.Rate = 1
          $s.SetOutputToWaveFile("$PWD\work\speech.wav")
          $s.Speak("Welcome back to the show. Today I want to talk about the worst job interview I ever had. I walked in, sat down, and realised I was in the wrong building. The interviewer did not notice. So I just answered every question. Forty minutes later, they offered me the job. I still work there. Nobody has ever asked how I got hired. Anyway, that is the story. Let's get into today's topic, which is backing up your files.")
          $s.Dispose()
      - name: Mux the test video
        working-directory: work
        run: ffmpeg -v error -y -f lavfi -i testsrc2=s=1280x720:r=30 -i speech.wav -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac source.mp4

      - name: "Claude: set up a page"
        working-directory: work
        run: |
          claude -p "I just installed Cliprig. Set up a clip page. 1. Page name: Windows Test, handle @windowstest. 2. Niche: funny workplace stories from podcasts. 3. Platforms: YouTube Shorts. 4. Time zone: UTC. Yes, go ahead with the plan, no need to confirm." \
            --plugin-dir "$GITHUB_WORKSPACE/cliprig" --allowedTools "$TOOLS" --max-budget-usd 3 \
            --output-format stream-json --verbose > setup.jsonl
      - name: "Claude: find, cut and check a clip"
        working-directory: work
        run: |
          page=$(dirname "$(ls -d */CLAUDE.md | head -1)")
          cp source.mp4 "$page/media/raw/"
          cd "$page"
          claude -p "Find the best moment in media/raw/source.mp4, cut it and check it's ok to post. It's my own test recording, so I own it: note that as the permission. I'm testing the flow, so make your own picks instead of asking me." \
            --plugin-dir "$GITHUB_WORKSPACE/cliprig" --allowedTools "$TOOLS" --max-budget-usd 3 \
            --output-format stream-json --verbose > ../clip.jsonl

      - name: Check what Claude left behind
        if: always()
        working-directory: work
        run: |
          page=$(dirname "$(ls -d */CLAUDE.md | head -1)")
          py="$page/.venv/Scripts/python.exe"
          test -f "$py" && echo "PASS  venv at .venv/Scripts/python.exe" || echo "FAIL  no .venv/Scripts/python.exe"
          (cd "$page" && ./.venv/Scripts/python.exe "$GITHUB_WORKSPACE/cliprig/scripts/doctor.py") | tee doctor.txt || true
          clip=$(ls "$page"/media/edits/*/*.mp4 2>/dev/null | head -1)
          test -n "$clip" && echo "PASS  clip: $clip" || { echo "FAIL  no clip in media/edits/<clip>/"; exit 1; }
          "$py" "$GITHUB_WORKSPACE/cliprig/scripts/check.py" "$clip" --caption "Clip from Windows Test." | tee check.txt
      - name: Summary of Claude's replies and tool use
        if: always()
        working-directory: work
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          for name in ("setup.jsonl", "clip.jsonl"):
              p = pathlib.Path(name)
              print(f"## {name}\n")
              if not p.exists():
                  print("(did not run)\n"); continue
              for line in p.read_text(encoding="utf-8", errors="replace").splitlines():
                  e = json.loads(line)
                  if e.get("type") == "assistant":
                      for c in e["message"]["content"]:
                          if c.get("type") == "tool_use":
                              i = c["input"]
                              print(f"- `{c['name']}` " + (i.get("command") or i.get("skill") or i.get("file_path") or "")[:200].replace("`", "'").replace("\n", " "))
                  if e.get("type") == "result":
                      print(f"\n**Result** (cost ${e.get('total_cost_usd', 0):.2f}):\n\n{e.get('result', '')}\n")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-skills-run
          path: |
            work/*.jsonl
            work/*.txt
            work/*/media/edits/
            work/*/media/raw/*/SOURCE.md
            work/*/CLAUDE.md
            work/*/playbook.md
