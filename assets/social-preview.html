<!doctype html>
<!-- Source for social-preview.png (GitHub: Settings > General > Social preview). Render (macOS, Brave or Chrome):
     "/Applications/Brave Browser.app/Contents/MacOS/Brave Browser" --headless=new --hide-scrollbars \
       --window-size=1280,640 --screenshot=assets/social-preview.png assets/social-preview.html -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #09090b; }
  /* full bleed and opaque: link cards crop and sit on any background */
  .card {
    position: relative; width: 1280px; height: 640px; box-sizing: border-box;
    background:
      radial-gradient(ellipse 55% 80% at 50% -15%, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0) 70%),
      #09090b;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased;
  }
  .card::before {
    content: ""; position: absolute; inset: 0 20% auto; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
  }
  .mark {
    width: 40px; height: 70px; box-sizing: border-box; border-radius: 10px;
    border: 3px solid #fafafa; position: relative; margin-bottom: 44px;
  }
  .mark::after {
    content: ""; position: absolute; left: 8px; right: 8px; bottom: 13px; height: 5px;
    border-radius: 2.5px; background: #ffd60a;
  }
  h1 {
    margin: 0; color: #fafafa; font-size: 148px; font-weight: 700;
    line-height: 1; letter-spacing: -0.045em;
  }
  p {
    margin: 30px 0 0; color: #a1a1aa; font-size: 36px; font-weight: 400;
    line-height: 1.3; letter-spacing: -0.012em;
  }
  .foot {
    position: absolute; bottom: 44px; color: #71717a; font-size: 22px; font-weight: 500; letter-spacing: 0;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark"></div>
    <h1>Cliprig</h1>
    <p>Long videos in. Vertical clips out.</p>
    <div class="foot">A Claude Code plugin</div>
  </div>
</body>
</html>
