<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Cliprig: long videos in, captioned vertical clips out">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0a17"/>
      <stop offset="1" stop-color="#1d1238"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a6b"/>
      <stop offset="1" stop-color="#14101f"/>
    </linearGradient>
    <linearGradient id="wide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#231a3d"/>
      <stop offset="1" stop-color="#2d2150"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd60a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd60a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <text x="80" y="230" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="132" fill="#ffffff" letter-spacing="-4">Clip<tspan fill="#ffd60a">rig</tspan></text>
  <text x="84" y="306" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="38" fill="#ffffff">Long videos in.</text>
  <text x="84" y="354" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="38" fill="#ffffff">Captioned vertical clips out.</text>
  <text x="84" y="414" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#b9b1d6">A Claude Code plugin for any niche.</text>
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700">
    <rect x="84" y="452" width="254" height="44" rx="22" fill="#ffd60a"/>
    <text x="211" y="481" text-anchor="middle" fill="#14101f">You approve every post</text>
    <rect x="352" y="452" width="180" height="44" rx="22" fill="none" stroke="#6f5fb0" stroke-width="2"/>
    <text x="442" y="481" text-anchor="middle" fill="#ffffff">Permission first</text>
    <rect x="546" y="452" width="150" height="44" rx="22" fill="none" stroke="#6f5fb0" stroke-width="2"/>
    <text x="621" y="481" text-anchor="middle" fill="#ffffff">No API keys</text>
  </g>
  <text x="84" y="572" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#8f86b3">github.com/codingwolf-at/cliprig</text>

  <g transform="translate(-170 92) scale(1.12)">
  <!-- long 16:9 source with waveform and the picked moment -->
  <g transform="translate(742 128) scale(0.88)">
    <rect width="300" height="169" rx="12" fill="url(#wide)" stroke="#4a3b86" stroke-width="2"/>
    <circle cx="150" cy="62" r="22" fill="#ffffff" opacity="0.12"/>
    <path d="M143 50 L163 62 L143 74 Z" fill="#ffffff" opacity="0.5"/>
    <text x="16" y="28" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#b9b1d6">2 h podcast</text>
    <rect x="148" y="104" width="62" height="52" rx="6" fill="#ffd60a" opacity="0.18"/>
    <g fill="#8f80d6">
      <rect x="18" y="126" width="5" height="12" rx="2"/><rect x="28" y="122" width="5" height="20" rx="2"/>
      <rect x="38" y="128" width="5" height="8" rx="2"/><rect x="48" y="120" width="5" height="24" rx="2"/>
      <rect x="58" y="126" width="5" height="12" rx="2"/><rect x="68" y="124" width="5" height="16" rx="2"/>
      <rect x="78" y="128" width="5" height="8" rx="2"/><rect x="88" y="122" width="5" height="20" rx="2"/>
      <rect x="98" y="127" width="5" height="10" rx="2"/><rect x="108" y="124" width="5" height="16" rx="2"/>
      <rect x="118" y="128" width="5" height="8" rx="2"/><rect x="128" y="123" width="5" height="18" rx="2"/>
      <rect x="138" y="126" width="5" height="12" rx="2"/>
      <rect x="218" y="124" width="5" height="16" rx="2"/><rect x="228" y="128" width="5" height="8" rx="2"/>
      <rect x="238" y="122" width="5" height="20" rx="2"/><rect x="248" y="127" width="5" height="10" rx="2"/>
      <rect x="258" y="125" width="5" height="14" rx="2"/><rect x="268" y="128" width="5" height="8" rx="2"/>
      <rect x="278" y="124" width="5" height="16" rx="2"/>
    </g>
    <g fill="#ffd60a">
      <rect x="152" y="116" width="5" height="32" rx="2"/><rect x="162" y="110" width="5" height="44" rx="2"/>
      <rect x="172" y="114" width="5" height="36" rx="2"/><rect x="182" y="108" width="5" height="48" rx="2"/>
      <rect x="192" y="113" width="5" height="38" rx="2"/><rect x="202" y="118" width="5" height="28" rx="2"/>
    </g>
    <text x="179" y="100" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#ffd60a">the moment</text>
  </g>

  <!-- arrow -->
  <path d="M1012 205 C 1040 205, 1048 205, 1068 205" stroke="#ffd60a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M1060 195 L1074 205 L1060 215" stroke="#ffd60a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- vertical clip -->
  <circle cx="1160" cy="220" r="150" fill="url(#glow)"/>
  <g transform="translate(1084 52)">
    <rect width="152" height="336" rx="22" fill="#0b0912" stroke="#e8e4f7" stroke-width="3"/>
    <rect x="8" y="8" width="136" height="320" rx="16" fill="url(#screen)"/>
    <circle cx="76" cy="150" r="34" fill="#ffffff" opacity="0.14"/>
    <rect x="48" y="186" width="56" height="70" rx="26" fill="#ffffff" opacity="0.10"/>
    <rect x="14" y="34" width="124" height="36" rx="3" fill="#ffffff"/>
    <text x="76" y="49" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="9.5" fill="#000000">He forgot he changed</text>
    <text x="76" y="63" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="9.5" fill="#000000">my whole life</text>
    <text x="76" y="236" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="17" fill="#ffffff" stroke="#000000" stroke-width="3" paint-order="stroke">YOU DON'T</text>
    <text x="76" y="258" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="17" fill="#ffd60a" stroke="#000000" stroke-width="3" paint-order="stroke">REMEMBER?</text>
    <rect x="58" y="314" width="36" height="4" rx="2" fill="#ffffff" opacity="0.5"/>
  </g>
  </g>
</svg>
