<!doctype html>
<!-- Source for banner.png. Render (macOS, Brave or Chrome):
     "/Applications/Brave Browser.app/Contents/MacOS/Brave Browser" --headless=new --hide-scrollbars \
       --default-background-color=00000000 --force-device-scale-factor=2 --window-size=1280,400 \
       --screenshot=assets/banner.png assets/banner.html -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  .card {
    position: relative; width: 1280px; height: 400px; box-sizing: border-box; overflow: hidden;
    border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.07);
    background:
      radial-gradient(ellipse 55% 85% at 50% -15%, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0) 70%),
      #09090b;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased;
  }
  /* hairline that catches light along the top edge */
  .card::before {
    content: ""; position: absolute; inset: 0 20% auto; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
  }
  .mark {
    width: 30px; height: 52px; box-sizing: border-box; border-radius: 8px;
    border: 2.5px solid #fafafa; position: relative; margin-bottom: 34px;
  }
  .mark::after {
    content: ""; position: absolute; left: 6px; right: 6px; bottom: 10px; height: 4px;
    border-radius: 2px; background: #ffd60a;
  }
  h1 {
    margin: 0; color: #fafafa; font-size: 104px; font-weight: 700;
    line-height: 1; letter-spacing: -0.04em;
  }
  p {
    margin: 22px 0 0; color: #a1a1aa; font-size: 26px; font-weight: 400;
    line-height: 1.3; letter-spacing: -0.01em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark"></div>
    <h1>Cliprig</h1>
    <p>Long videos in. Vertical clips out.</p>
  </div>
</body>
</html>
